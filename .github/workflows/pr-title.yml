name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize]

# Nothing here writes to the repository, so start from zero and grant per job.
permissions: {}

# Titles follow conventional commits because we squash-merge, so the PR title
# becomes the commit message on main. Scopes are optional, `fix(journal):` and
# plain `fix:` both pass.
jobs:
  semantic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            build
            ci
            chore
            revert
