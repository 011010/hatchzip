# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json

# The Inno Setup installer from packaging/windows/hatchzip.iss. It always
# installs for the current user (PrivilegesRequired=lowest), so no switches
# are set here: winget's defaults for inno, /SP- /VERYSILENT
# /SUPPRESSMSGBOXES /NORESTART, are what a silent install needs, and the
# "Open HatchZip" step at the end is skipped when silent.
PackageIdentifier: Xevrion.HatchZip
PackageVersion: 0.1.4
InstallerLocale: en-US
MinimumOSVersion: 10.0.0.0
InstallerType: inno
Scope: user
InstallModes:
- interactive
- silent
- silentWithProgress
UpgradeBehavior: install
Commands:
- hatchzip
- hz
FileExtensions:
- "001"
- 7z
- gz
- tar
- tgz
- zip
ReleaseDate: 2026-10-25
# Inno Setup writes the uninstall entry under the AppId plus "_is1".
AppsAndFeaturesEntries:
- DisplayName: HatchZip
  Publisher: Yash Bavadiya
  ProductCode: io.github.xevrion.hatchzip_is1
InstallationMetadata:
  DefaultInstallLocation: '%LocalAppData%\Programs\HatchZip'
Installers:
- Architecture: x64
  InstallerUrl: https://github.com/xevrion/hatchzip/releases/download/v0.1.4/HatchZip-x64-setup.exe
  InstallerSha256: 41433D4DE8834A211D7E5176B0101A7D4B04F5B8CC5C4B6E43D54A4285C3C497
  ProductCode: io.github.xevrion.hatchzip_is1
ManifestType: installer
ManifestVersion: 1.12.0
